<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Artist Unlocked Remote</title>
    <!-- Use CDN for better reliability, with local fallback -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" crossorigin="anonymous"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="/socket.io/socket.io.js"><\/script>');
        }
    </script>
    <style>
        :root {
            --primary: #00E5FF;
            --secondary: #f39c12;
            --danger: #ff4444;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #000;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-bottom: 330px; /* Space for fixed controls + timer */
        }
        .status-bar {
            background: #222;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-left: 4px solid var(--primary);
        }
        .card.answer-card {
            border-left-color: var(--secondary);
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .card.answer-card:active {
            background: #252525;
        }
        .label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }
        .value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .answer-text {
            font-size: 1.3rem;
            color: var(--secondary);
            text-align: center;
        }
        .hidden-answer {
            text-align: center;
            opacity: 0.6;
            font-style: italic;
            font-size: 0.9rem;
        }
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-top: 1px solid #333;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        button {
            background: #333;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        button:active {
            background: #444;
            transform: scale(0.98);
        }
        button.primary { background: var(--primary); color: #000; }
        button.secondary { background: var(--secondary); color: #000; }
        button.danger { background: var(--danger); color: #fff; }
        button.ghost { background: transparent; border: 1px solid #444; color: #aaa; padding: 0.4rem 0.8rem; font-size: 0.7rem; }
        button.timer-start { background: #0d6efd; color: #fff; }
        button.timer-stop { background: var(--danger); color: #fff; }
        .timer-controls-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .timer-settings {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
        }
        .timer-settings input[type="number"] {
            width: 48px;
            text-align: center;
            padding: 0.3rem;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .timer-auto-label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
            color: #aaa;
            cursor: pointer;
            margin-left: auto;
        }
        button:disabled { opacity: 0.2; }

        .team-row {
            display: flex;
            flex-direction: column;
            padding: 0.75rem;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            gap: 0.75rem;
        }
        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team-pts { color: var(--primary); font-weight: bold; }
        .score-actions {
            display: flex;
            gap: 0.5rem;
        }
        .score-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.8rem;
        }
        .all-in-btn.active {
            background: var(--danger);
            color: white;
        }

        .auth-error-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        /* Timer Display */
        .timer-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border-left: 4px solid var(--primary);
        }
        .timer-card.urgent {
            border-left-color: var(--danger);
            animation: mobileTimerPulse 0.5s infinite;
        }
        .timer-number-mobile {
            font-size: 2.5rem;
            font-weight: 900;
            font-family: monospace;
        }
        .timer-number-mobile.urgent {
            color: var(--danger);
        }
        .timer-label-mobile {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }
        .timer-expired-mobile {
            color: var(--danger);
            font-weight: 900;
            font-size: 1.2rem;
        }
        @keyframes mobileTimerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        #debug-console {
            position: fixed;
            top: 50px; left: 0; right: 0;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            font-family: monospace;
            font-size: 10px;
            padding: 5px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 2000;
            border-bottom: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="auth-error" class="auth-error-overlay">
        <h1 style="color:#ff4444;">⚠️ Session Expired</h1>
        <p>The security key has changed.</p>
        <p>Please scan the <b>new</b> QR code on the Dashboard to reconnect.</p>
    </div>

    <div class="header">
        <h1 onclick="toggleDebug()">Artist Unlocked Remote</h1>
        <button id="btn-stop" class="ghost">Stop Hosting</button>
    </div>

    <div id="debug-console"></div>

    <div class="content" id="main-content">
        <div class="status-bar">
            <span id="connection-status">Connecting...</span>
            <span id="game-status">No Quiz Hosted</span>
        </div>

        <div id="timer-display" style="display: none;"></div>

        <div id="quiz-info" style="display: none;">
            <div class="card">
                <span class="label" id="phase-label">Phase</span>
                <div class="value" id="artist-name">Artist Name</div>
            </div>

            <div class="card">
                <span class="label">Question / Hint</span>
                <div class="value" id="question-text" style="font-weight: normal; line-height: 1.4;">Waiting for question...</div>
            </div>

            <div class="card answer-card" id="answer-card">
                <span class="label">Answer (Tap to Peek)</span>
                <div id="answer-display">
                    <div class="hidden-answer">🔒 Hidden on Presentation</div>
                </div>
            </div>

            <div id="team-section">
                <span class="label">Teams & Scoring</span>
                <div id="team-list"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-row">
            <button id="btn-prev">⬅ Prev</button>
            <button id="btn-next" class="primary">Next ➡</button>
        </div>
        <div class="timer-controls-row">
            <div class="timer-settings">
                <span style="font-size:0.9rem;">⏱</span>
                <input id="timer-duration-input" type="number" min="5" max="120" value="30">
                <span style="color:#888; font-size:0.75rem;">sec</span>
                <label class="timer-auto-label">
                    <input type="checkbox" id="timer-auto-check"> Auto
                </label>
            </div>
            <button id="btn-timer" class="timer-start">⏱ Start</button>
        </div>
        <div class="control-row">
            <button id="btn-board">📋 Board</button>
            <button id="btn-leaderboard">🏆 Scores</button>
        </div>
        <button id="btn-reveal" class="secondary">👁 Reveal Answer</button>
        <button id="btn-spotify">🎵 Play Spotify</button>
    </div>

    <script>
        const debugConsole = document.getElementById('debug-console');
        function log(msg) {
            console.log(msg);
            const line = document.createElement('div');
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugConsole.appendChild(line);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        function toggleDebug() {
            debugConsole.style.display = debugConsole.style.display === 'none' ? 'block' : 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const authGuid = urlParams.get('auth');

        const socket = io({
            query: { auth: authGuid },
            transports: ['polling', 'websocket'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        let gameState = null;
        let cachedQuizData = [];
        let localPeek = false;
        let timerInterval = null;

        socket.on('connect', () => {
            log('Connected to server');
            document.getElementById('connection-status').innerText = '✅ Connected';
            document.getElementById('connection-status').style.color = '#1db954';
            setTimeout(() => socket.emit('request-state'), 500);
        });

        socket.on('disconnect', (reason) => {
            log('Disconnected: ' + reason);
            document.getElementById('connection-status').innerText = '⚠️ Reconnecting...';
            document.getElementById('connection-status').style.color = '#f39c12';
        });

        socket.on('reconnect', (attemptNumber) => {
            log('Reconnected after ' + attemptNumber + ' attempts');
            document.getElementById('connection-status').innerText = '✅ Connected';
            document.getElementById('connection-status').style.color = '#1db954';
            socket.emit('request-state');
        });

        socket.on('reconnect_attempt', (attemptNumber) => {
            log('Reconnection attempt #' + attemptNumber);
        });

        socket.on('connect_error', (err) => {
            if (err.message.includes('AUTH_FAILED')) {
                document.getElementById('auth-error').style.display = 'flex';
            }
        });

        socket.on('state-updated', (state) => {
            log(`State Received! Mode: ${state?.spotifyMobileMode || 'desktop'}, Artists: ${state?.quizData?.length || 0}`);

            // Handle partial state (quizData may be omitted for lightweight updates)
            if (state.quizData && state.quizData.length > 0) {
                cachedQuizData = state.quizData;
            }

            // Reset local peek if we move to a new question
            if (gameState && (state.activeArtistIndex !== gameState.activeArtistIndex || state.activeTier !== gameState.activeTier)) {
                localPeek = false;
            }

            gameState = {
                ...state,
                quizData: (state.quizData && state.quizData.length > 0) ? state.quizData : cachedQuizData
            };
            updateUI();
            updateTimer();
        });

        // Timer update loop
        function updateTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            const timerDisplay = document.getElementById('timer-display');
            if (!gameState || !gameState.timerEndTime) {
                timerDisplay.style.display = 'none';
                return;
            }

            timerDisplay.style.display = 'block';

            function tick() {
                if (!gameState || !gameState.timerEndTime) {
                    timerDisplay.style.display = 'none';
                    return;
                }

                const remaining = Math.max(0, Math.ceil((gameState.timerEndTime - Date.now()) / 1000));
                const isUrgent = remaining <= 10 && remaining > 0;
                const isExpired = remaining <= 0;

                if (isExpired) {
                    timerDisplay.innerHTML = `
                        <div class="timer-card urgent">
                            <div class="timer-expired-mobile">TIME'S UP!</div>
                        </div>
                    `;
                    clearInterval(timerInterval);
                    timerInterval = null;
                } else {
                    timerDisplay.innerHTML = `
                        <div class="timer-card ${isUrgent ? 'urgent' : ''}">
                            <div class="timer-label-mobile">Timer</div>
                            <div class="timer-number-mobile ${isUrgent ? 'urgent' : ''}">${remaining}</div>
                        </div>
                    `;
                }
            }

            tick();
            timerInterval = setInterval(tick, 200);
        }

        function updateUI() {
            if (!gameState || !gameState.quizData || gameState.quizData.length === 0) {
                document.getElementById('quiz-info').style.display = 'none';
                document.getElementById('game-status').innerText = 'Idle';
                return;
            }

            document.getElementById('quiz-info').style.display = 'block';
            document.getElementById('game-status').innerText = `Round ${gameState.activeArtistIndex + 1}/${gameState.quizData.length}`;

            const artist = gameState.quizData[gameState.activeArtistIndex];
            document.getElementById('artist-name').innerText = artist.artist;

            const isUnlock = gameState.activeTier === 0;
            document.getElementById('phase-label').innerText = isUnlock ? '🔓 Unlock Phase' : `Tier ${gameState.activeTier}`;

            const currentQ = isUnlock ? null : artist.lore_ladder[gameState.activeTier - 1];
            document.getElementById('question-text').innerText = isUnlock ? 'Phase 1: Identification' : currentQ.spoken_hint;

            // Answer Display
            const answerDiv = document.getElementById('answer-display');
            const fullAnswer = isUnlock ? `${artist.artist} - ${artist.unlock_song}` : currentQ.answer;

            if (gameState.showAnswer || localPeek) {
                answerDiv.innerHTML = `<div class="answer-text">${fullAnswer}</div>`;
            } else {
                answerDiv.innerHTML = `<div class="hidden-answer">🔒 Tap to peek (Hidden on Presentation)</div>`;
            }

            // Buttons
            document.getElementById('btn-reveal').disabled = gameState.showAnswer;
            document.getElementById('btn-prev').disabled = gameState.activeArtistIndex === 0 && gameState.activeTier === 0;

            const isFinal = gameState.activeArtistIndex === gameState.quizData.length - 1 && gameState.activeTier === 5 && gameState.showAnswer;
            document.getElementById('btn-next').innerText = isFinal ? '🏁 Finish' : 'Next ➡';
            document.getElementById('btn-next').className = isFinal ? 'primary' : 'primary';
            if (isFinal) document.getElementById('btn-next').style.background = '#1db954';
            else document.getElementById('btn-next').style.background = '';

            document.getElementById('btn-board').style.border = gameState.showBoard ? '2px solid var(--primary)' : 'none';
            document.getElementById('btn-leaderboard').style.border = gameState.showLeaderboard ? '2px solid var(--primary)' : 'none';

            // Sync timer controls with game state
            const btnTimer = document.getElementById('btn-timer');
            if (gameState.timerEndTime) {
                btnTimer.textContent = '⏹ Stop';
                btnTimer.className = 'timer-stop';
            } else {
                btnTimer.textContent = '⏱ Start';
                btnTimer.className = 'timer-start';
            }
            const durationInput = document.getElementById('timer-duration-input');
            if (document.activeElement !== durationInput) {
                durationInput.value = gameState.timerDuration || 30;
            }
            document.getElementById('timer-auto-check').checked = !!gameState.timerAutoStart;

            const spotifyUri = isUnlock ? artist.unlock_song_uri : currentQ?.audio_hint_uri;
            document.getElementById('btn-spotify').disabled = !spotifyUri;
            document.getElementById('btn-spotify').innerText = spotifyUri ? '🎵 Play Spotify' : '❌ No Track';

            // Teams
            const teamList = document.getElementById('team-list');
            teamList.innerHTML = '';
            const currentTierPts = isUnlock ? 10 : (currentQ?.points || 10);

            gameState.teams.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'team-row';

                const allInLabel = t.allInUsed ? (gameState.allInActive ? '🔥 ACTIVE' : '🔒 USED') : 'All-In';
                const allInClass = (gameState.allInActive && t.allInUsed) ? 'active' : '';

                div.innerHTML = `
                    <div class="team-header">
                        <span><strong>${t.name}</strong></span>
                        <span class="team-pts">${t.score} pts</span>
                    </div>
                    <div class="score-actions">
                        <button onclick="addPoints(${i}, -${currentTierPts})" style="background:#dc3545">-${currentTierPts}</button>
                        <button onclick="addPoints(${i}, -5)" style="background:#ff4444">-5</button>
                        <button onclick="addPoints(${i}, 5)" style="background:#28a745">+5</button>
                        <button onclick="addPoints(${i}, ${currentTierPts})" style="background:#1db954">+${currentTierPts}</button>
                        <button class="all-in-btn ${allInClass}" onclick="toggleAllIn(${i})" ${ (t.allInUsed && !gameState.allInActive) ? 'disabled' : ''}>${allInLabel}</button>
                    </div>
                `;
                teamList.appendChild(div);
            });
        }

        // Logic Helpers
        function broadcast(s) {
            socket.emit('broadcast-state', s);
        }

        function addPoints(teamIdx, pts) {
            const s = JSON.parse(JSON.stringify(gameState));
            let multiplier = 1;
            if (s.allInActive && pts > 0) multiplier = 2;
            s.teams[teamIdx].score += (pts * multiplier);
            broadcast(s);
        }

        function toggleAllIn(idx) {
            const s = JSON.parse(JSON.stringify(gameState));
            if (s.teams[idx].allInUsed && !s.allInActive) return;

            if (!s.allInActive) {
                s.teams[idx].allInUsed = true;
                s.allInActive = true;
            } else {
                s.allInActive = false;
            }
            broadcast(s);
        }

        document.getElementById('btn-timer').onclick = () => {
            if (!gameState) return;
            if (gameState.timerEndTime) {
                broadcast({ ...gameState, timerEndTime: null });
            } else {
                const duration = parseInt(document.getElementById('timer-duration-input').value) || 30;
                broadcast({ ...gameState, timerEndTime: Date.now() + duration * 1000, timerDuration: duration });
            }
        };

        document.getElementById('timer-auto-check').onchange = (e) => {
            if (!gameState) return;
            broadcast({ ...gameState, timerAutoStart: e.target.checked });
        };

        document.getElementById('timer-duration-input').onchange = (e) => {
            if (!gameState) return;
            const duration = Math.min(120, Math.max(5, parseInt(e.target.value) || 30));
            e.target.value = duration;
            // Update local state so Start uses the new value without needing a broadcast
            gameState = { ...gameState, timerDuration: duration };
        };

        document.getElementById('btn-stop').onclick = () => {
            if (confirm('Stop hosting and exit?')) {
                broadcast({ ...gameState, quizData: [] });
            }
        };

        document.getElementById('btn-board').onclick = () => {
            broadcast({ ...gameState, showBoard: !gameState.showBoard });
        };

        document.getElementById('btn-leaderboard').onclick = () => {
            broadcast({ ...gameState, showLeaderboard: !gameState.showLeaderboard });
        };

        document.getElementById('answer-card').onclick = () => {
            localPeek = !localPeek;
            updateUI();
        };

        document.getElementById('btn-next').onclick = () => {
            broadcast(getNextState(gameState));
        };

        document.getElementById('btn-prev').onclick = () => {
            if (gameState.winnerMode) {
                broadcast({ ...gameState, winnerMode: false });
            } else {
                broadcast(getPrevState(gameState));
            }
        };

        document.getElementById('btn-reveal').onclick = () => {
            broadcast({ ...gameState, showAnswer: true });
        };

        document.getElementById('btn-spotify').onclick = () => {
            const isUnlock = gameState.activeTier === 0;
            const artist = gameState.quizData[gameState.activeArtistIndex];
            const uri = isUnlock ? artist.unlock_song_uri : artist.lore_ladder[gameState.activeTier - 1].audio_hint_uri;

            if (uri) {
                if (gameState.spotifyMobileMode === 'mobile_app') {
                    window.location.assign(uri);
                } else if (gameState.spotifyMobileMode === 'mobile_web') {
                    const parts = uri.split(':');
                    if (parts.length >= 3) {
                        const url = `https://open.spotify.com/${parts[1]}/${parts[2]}`;
                        window.open(url, '_blank');
                    } else {
                        const url = uri.replace('spotify:', 'https://open.spotify.com/').replace(/:/g, '/');
                        window.open(url, '_blank');
                    }
                } else {
                    socket.emit('spotify-trigger', uri);
                }
            }
        };

        function getNextState(state) {
            const s = JSON.parse(JSON.stringify(state));
            s.showAnswer = false;
            s.allInActive = false;
            s.showBoard = false;
            s.timerEndTime = null;
            if (s.activeTier < 5) s.activeTier++;
            else if (s.activeArtistIndex < s.quizData.length - 1) {
                s.activeArtistIndex++;
                s.activeTier = 0;
            } else s.winnerMode = true;
            // Auto-start timer
            if (s.timerAutoStart && !s.winnerMode) {
                s.timerEndTime = Date.now() + (s.timerDuration || 30) * 1000;
            }
            return s;
        }

        function getPrevState(state) {
            const s = JSON.parse(JSON.stringify(state));
            s.showAnswer = false;
            s.allInActive = false;
            s.showBoard = false;
            s.timerEndTime = null;
            if (s.activeTier > 0) s.activeTier--;
            else if (s.activeArtistIndex > 0) {
                s.activeArtistIndex--;
                s.activeTier = 5;
            }
            return s;
        }
    </script>
</body>
</html>
